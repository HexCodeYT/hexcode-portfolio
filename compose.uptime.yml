services:
  uptime-worker:
    build:
      context: .
      dockerfile: Dockerfile.uptime
    container_name: hexcode-uptime
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - uptime-data:/app/data
    environment:
      CHECK_INTERVAL_MS: "300000"

volumes:
  uptime-data:
